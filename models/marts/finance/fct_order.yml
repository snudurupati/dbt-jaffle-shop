models:
  - name: fct_order
    description: The fct_order model consolidates order data from the Jaffle Shop and payment data from Stripe to provide a comprehensive view of orders, including their associated payments. It includes details such as order ID, customer ID, order date, and the total amount paid for each order. The model ensures that even orders without successful payments are accounted for by setting the amount to 0 in such cases.
    columns:
      - name: order_id
        description: A unique identifier for each order placed by a customer.
        data_type: number
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 99
      - name: customer_id
        description: The unique identifier for the customer who placed the order.
        data_type: number
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 99
      - name: order_date
        description: The date on which the order was placed.
        data_type: date
      - name: amount
        description: The total payment amount associated with an order. If no successful payments are recorded for the order, the value defaults to 0.
        data_type: number
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 58
    tests:
      - dbt_utils.recency:
          field: ORDER_DATE
          datepart: day
          interval: 1
